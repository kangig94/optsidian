name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          node -e 'const fs=require("node:fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); const expected=`v${pkg.version}`; const actual=process.env.GITHUB_REF_NAME; if (actual !== expected) { console.error(`Tag ${actual} does not match package version ${expected}`); process.exit(1); }'

      - name: Run test suite
        run: npm test

      - name: Package release assets
        run: npm run package:release

      - name: Verify curated GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            {
              echo "Missing GitHub Release ${GITHUB_REF_NAME}."
              echo "Create it manually with release notes written from docs/CHANGELOG.md, then rerun this workflow."
            } >&2
            exit 1
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "release/optsidian-${GITHUB_REF_NAME}" \
            "release/optsidian-mcp-${GITHUB_REF_NAME}" \
            "release/checksums-${GITHUB_REF_NAME}.txt" \
            --clobber
          gh release edit "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --latest
